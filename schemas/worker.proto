syntax = "proto3";
package semantic_thread.worker.v1;

message ProtocolVersion { uint32 major = 1; uint32 minor = 2; }
message SchemaVersion { uint32 major = 1; uint32 minor = 2; }
message SnapshotId {
  string base_revision = 1;
  string project_model_hash = 2;
}
message BlobRef {
  string content_hash = 1;
  string relative_path = 2;
  uint64 size_bytes = 3;
}
enum RequestKind {
  REQUEST_KIND_UNSPECIFIED = 0;
  HANDSHAKE = 1;
  OPEN_PROJECT = 2;
  INDEX_FILES = 3;
  SHUTDOWN = 9;
}

message OpenProjectRequest { SchemaVersion schema_version = 1; string repo = 2; optional string compilation = 3; }
message IndexFilesRequest { SchemaVersion schema_version = 1; string repo = 2; optional string compilation = 3; bool syntax_only = 4; repeated string relative_files = 5; }
message ShutdownRequest { SchemaVersion schema_version = 1; }

message WorkerRequest {
  uint64 request_id = 1;
  ProtocolVersion protocol_version = 2;
  SnapshotId snapshot = 3;
  oneof payload {
    OpenProjectRequest open_project = 10;
    IndexFilesRequest index_files = 11;
    ShutdownRequest shutdown = 17;
  }
}

message WorkerCapabilities {
  string language = 1;
  string worker_version = 2;
  string compiler_version = 3;
  repeated ProtocolVersion protocol_versions = 4;
  repeated string supported_operations = 5;
  repeated string supported_language_features = 6;
  repeated string unsupported_features = 7;
}
message WorkerError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  repeated string evidence = 4;
}
message OpenProjectResponse { SchemaVersion schema_version = 1; bytes canonical_json = 2; repeated BlobRef blobs = 3; string project_model_hash = 4; string compiler_version = 5; string compilation = 6; }
message IndexFilesResponse { SchemaVersion schema_version = 1; bytes canonical_json = 2; repeated BlobRef blobs = 3; string index_hash = 4; string project_model_hash = 5; string compilation = 6; uint64 file_count = 7; bool partial = 8; }
message ShutdownResponse { SchemaVersion schema_version = 1; bytes canonical_json = 2; }

message WorkerResponse {
  uint64 request_id = 1;
  ProtocolVersion protocol_version = 2;
  oneof payload {
    WorkerCapabilities capabilities = 10;
    OpenProjectResponse open_project = 11;
    IndexFilesResponse index_files = 12;
    WorkerError error = 18;
    ShutdownResponse shutdown = 19;
  }
}
