syntax = "proto3";
package semantic_thread.facts.v1;

message SchemaVersion { uint32 major = 1; uint32 minor = 2; }
message SourceRange { string file_id = 1; uint64 start = 2; uint64 end = 3; }
message ArgumentParameter { uint64 argument_start = 1; string parameter = 2; string parameter_type = 3; }
message SemanticFact {
  string kind = 1;
  SourceRange origin = 2;
  string symbol_id = 3;
  string inferred_type = 4;
  string receiver_type = 5;
  repeated ArgumentParameter argument_to_parameter = 6;
  repeated string effects = 7;
}
message DeclarationFact {
  string declaration_id = 1;
  string symbol_id = 2;
  string kind = 3;
  string containing_declaration = 4;
  SourceRange origin = 5;
  string source_signature_hash = 6;
  string body_hash = 7;
  string abi_hash = 8;
  string semantic_summary_hash = 9;
}
message FileFacts {
  string file_id = 1;
  string module = 2;
  string source_set = 3;
  string normalized_relative_path = 4;
  string content_hash = 5;
  string package_name = 6;
  repeated string imports = 7;
  repeated string declaration_ids = 8;
  string line_ending = 9;
  bool has_bom = 10;
  repeated DeclarationFact declarations = 11;
  repeated SemanticFact semantic_facts = 12;
}
message SemanticFacts {
  SchemaVersion schema_version = 1;
  string compilation = 2;
  string project_model_hash = 3;
  string classpath_hash = 4;
  string compiler_options_hash = 5;
  repeated FileFacts files = 6;
  string index_hash = 7;
}
