syntax = "proto3";
package semantic_thread.transaction.v1;

message SchemaVersion { uint32 major = 1; uint32 minor = 2; }
message WriteFact { string kind = 1; string key = 2; string before_hash = 3; string after_hash = 4; }
message ValidationEvidence { string kind = 1; string status = 2; string evidence_hash = 3; }
message TransactionRecord {
  SchemaVersion schema_version = 1;
  string transaction_id = 2;
  string actor_id = 3;
  string intent = 4;
  string base_revision = 5;
  string base_index_snapshot = 6;
  string project_model_hash = 7;
  string status = 8;
  repeated string operation_ids = 9;
  string expected_write_set_hash = 10;
  string actual_write_set_hash = 11;
  repeated WriteFact actual_write_set = 12;
  repeated ValidationEvidence validation_evidence = 13;
  string candidate_commit = 14;
  string final_commit = 15;
  string target_ref = 16;
}
