urce level, RequestPublisher.ExecuteAsync creates one Kafka producer using KAFKA_BOOTSTRAP or kafka:9092, with idempotence enabled and a 10-second message timeout. While the token is not cancelled, it calls PublishPending and waits one second between passes. PublishPending selects at most one eligible unpublished row in created_at order with FOR UPDATE SKIP LOCKED; if none is returned, it exits that pass without sending. For a selected row it extracts place.id from the stored JSON, awaits a send to weather.place-requested using that ID as the key, then sets published=true and commits the database transaction. Since send completion comes before the database commit, a crash between them can leave the row eligible for another send. The loop logs other exceptions as PUBLISH_RETRY; cancellation during PublishPending breaks the loop, while cancellation reaching the post-attempt delay can propagate. C# source coverage is PARTIAL; this code does not establish runtime hosting activation or delivery."},"title":"Place request publisher"},{"boundaries":["DECLARED_TRANSITION_NOT_REACHED:places-place-requested-to-dashboard","DECLARED_TRANSITION_NOT_REACHED:places-place-requested-to-forecasts","EXCEPTION_FLOW_REQUIRES_SOURCE_REVIEW","EXTERNAL_CALL_BODY_NOT_EXPANDED","SHORT_CIRCUIT_FLOW_REQUIRES_SOURCE_REVIEW","LINKED_PROCESS_UNASSESSED:dashboard-place-requested-consumer","LINKED_PROCESS_UNASSESSED:forecasts-place-requested-consumer"],"documentationLanguage":"en","events":[],"explanation":[],"findings":[],"id":"process-overview","interfaceContracts":[],"participants":[],"summary":{"dependencyIds":["interaction:places-place-requested-to-dashboard","interaction:places-place-requested-to-forecasts","places:symbol:722b268c12cec9e1cb51cbe8","places:symbol:7fb8137cf82d592b243e54aa","process-component:places-request-publisher:dashboard-place-requested-consumer","process-component:places-request-publisher:forecasts-place-requested-consumer","process-scope:places-request-publisher","process:places-request-publisher"],"id":"claim-8ef30e9e100101a18cf2","sourceIds":["places-722b268c12cec9e1cb51","places-7fb8137cf82d592b243e"],"text":"ExecuteAsync creates a producer and repeatedly calls PublishPending until cancellation, logging other exceptions as PUBLISH_RETRY and waiting one second between attempts. Each publish opens a database transaction and selects one eligible unpublished row in created_at order with FOR UPDATE SKIP LOCKED; no row returns without sending. Otherwise it extracts the place ID from the payload, awaits a keyed send to weather.place-requested, marks the row published, and commits. A broker send followed by a transaction failure or crash can leave the row eligible for replay. The Dashboard and Forecasts topic mappings are agent-proposed; subscription, downstream processing and hosted-service activation remain unverified."},"title":"Publish pending place requests"}],"process":{"authority":"Explicit saved request; generated interpretation is reviewed separately.","definition":{"id":"places-request-publisher","interactions":["places-place-requested-to-forecasts","places-place-requested-to-dashboard"],"maxDepth":4,"maxNodes":64,"process":{"linkedSubviews":["dashboard-place-requested-consumer","forecasts-place-requested-consumer"],"objects":[],"outcomes":["If an unpublished request row is selected, send its payload to weather.place-requested and then mark that outbox row published in the database transaction.","If no unpublished row is available, the publish operation returns without sending a message.","Other observed failures are logged for retry; the source alone does not establish that the hosted service is activated at runtime."],"participants":["places","forecasts","dashboard"],"scope":"RequestPublisher.ExecuteAsync and its source-level outbox publishing operation.","trigger":"ExecuteAsync receives a cancellation token and enters its publisher loop."},"root":{"selector":{"language":"csharp","name":"ExecuteAsync","owner":"class:Weather.P xception) when (token.IsCancellationRequested) { break; }\n            catch (Exception error) { logger.LogWarning(error, \"PUBLISH_RETRY\"); }","textDigest":"sha256:be348c82f0e48dbc93bd49784d474f3ef0c96e81251769e51952fb29c19701a3","url":"https://github.com/codeclew/clew-weather-demo/blob/c289b28be4819eddf29d59a7c12f178559ec5229/services/places/RequestPublisher.cs#L12-L14"},"places-158b244bf27716919353":{"authority":"EXACT_SNAPSHOT_TEXT","endLine":10,"evidenceDigest":"sha256:a7b6adeb542a9964a6258105f1f0b1e407cb53e303dcb96b4a4d4bc909ed0037","file":"services/places/RequestPublisher.cs","id":"places-158b244bf27716919353","revision":"c289b28be4819eddf29d59a7c12f178559ec5229","service":"places","startLine":10,"text":"!token.IsCancellationRequested","textDigest":"sha256:05b0c045b6f0c2ac37688b690120998768eb93027e482f799cc070125d19a6a8","url":"https://github.com/codeclew/clew-weather-demo/blob/c289b28be4819eddf29d59a7c12f178559ec5229/services/places/RequestPublisher.cs#L10-L10"},"places-722b268c12cec9e1cb51":{"authority":"EXACT_SNAPSHOT_TEXT","endLine":34,"evidenceDigest":"sha256:4c2a37722e8f758d81ef32cc8048686f59a02936773d6194edf5248ea9b158b6","file":"services/places/RequestPublisher.cs","id":"places-722b268c12cec9e1cb51","revision":"c289b28be4819eddf29d59a7c12f178559ec5229","service":"places","startLine":18,"text":"public async Task PublishPending(IProducer\u003cstring, string> producer, CancellationToken token)\n    {\n        await using var connection = await repository.Open(token);\n        await using var transaction = await connection.BeginTransactionAsync(token);\n        await using var command = new NpgsqlCommand(\"SELECT id,payload::text FROM request_outbox WHERE NOT published ORDER BY created_at LIMIT 1 FOR UPDATE SKIP LOCKED\", connection, transaction);\n        Guid id; string payload;\n        await using (var reader = await command.ExecuteReaderAsync(token))\n        {\n            if (!await reader.ReadAsync(token)) return;\n            id = reader.GetGuid(0); payload = reader.GetString(1);\n        }\n        var placeId = JsonDocument.Parse(payload).RootElement.GetProperty(\"place\").GetProperty(\"id\").GetString()!;\n        await producer.ProduceAsync(\"weather.place-requested\", new Message\u003cstring, string> { Key = placeId, Value = payload }, token);\n        await using var mark = new NpgsqlCommand(\"UPDATE request_outbox SET published=true WHERE id=$1\", connection, transaction);\n        mark.Parameters.AddWithValue(id); await mark.ExecuteNonQueryAsync(token);\n        await transaction.CommitAsync(token);\n    }","textDigest":"sha256:5402c70e41f029dbb02eb020cc4e28fc9f0ba004f670d74c7915aa4b7906db7f","url":"https://github.com/codeclew/clew-weather-demo/blob/c289b28be4819eddf29d59a7c12f178559ec5229/services/places/RequestPublisher.cs#L18-L34"},"places-7fb8137cf82d592b243e":{"authority":"EXACT_SNAPSHOT_TEXT","endLine":17,"evidenceDigest":"sha256:a7b6adeb542a9964a6258105f1f0b1e407cb53e303dcb96b4a4d4bc909ed0037","file":"services/places/RequestPublisher.cs","id":"places-7fb8137cf82d592b243e","revision":"c289b28be4819eddf29d59a7c12f178559ec5229","service":"places","startLine":7,"text":"protected override async Task ExecuteAsync(CancellationToken token)\n    {\n        using var producer = new ProducerBuilder\u003cstring, string>(new ProducerConfig { BootstrapServers = Environment.GetEnvironmentVariable(\"KAFKA_BOOTSTRAP\") ?? \"kafka:9092\", EnableIdempotence = true, MessageTimeoutMs = 10000 }).Build();\n        while (!token.IsCancellationRequested)\n        {\n            try { await PublishPending(producer, token); }\n            catch (OperationCanceledException) when (token.IsCancellationRequested) { break; }\n            catch (Exception error) { logger.LogWarning(error, \"PUBLISH_RETRY\"); }\n            await Task.Delay(1000, token);\n        }\n    }","textDigest":"sha256:cdb8aae092e7b0dcc178c111ad01e7c214015c8f589f814b2ce3f67cc83336a3","url":"https://github.com/codeclew/clew-weather-demo/blob/c289b28be const serviceSectionOrder=['section-overview','section-responsibilities','section-entities','section-ingress','section-egress'];
function serviceProfile(){

 return chromeHtml`<section class="service-profile" aria-label="Service profile">${definitions.map(([id,title])=>{

   detail=chromeHtml`<p class="profile-note">DTOs and implementation classes alone do not establish entity ownership or creation.</p>${entities.length?chromeHtml`<p>Declared domain identities: ${entities.map(d=>esc(d.normalized.entity.title)).join(', ')}.</p>`:chromeHtml`<p class="profile-gap">Entity ownership and creation roles have no explicit domain declarations in this publication.</p>`}`;

if(D.process){for(const operation of D.operations.filter(o=>!o.id.startsWith('section-')&&!o.id.startsWith('assessment-')&&o.id!=='process-overview'&&!o.dataflow)){if(!entries.some(entry=>entry.id===operation.id))entries.push({id:operation.id,symbol:translationGaps[operation.id]?operation.id:operation.title,kind:'SCENARIO',trigger:{methods:['FLOW'],paths:[]},sourceIds:[]});}}

function threadEvidenceLinks(sourceIds){

 return ids.map(id=>chromeHtml`<a class="source-link" href="${esc(threadSourceHref(id,thread.methods[id].source.startLine))}">${esc(t('Source'))} · ${esc(thread.methods[id].label)}</a>`).join(' ')+(outside.length?' '+button(outside,t('Retained source outside the selected thread'),true):'');

function threadAnchorHref(id){return '#'+(current?.kind==='SERVICE_FRAGMENT'?current.id+'~':'')+id;}

 return chromeHtml`<section class="process-extraction"><h3>${esc(t('Extracted evidence envelope'))}</h3><p>${esc(t('Potential static behavior; business intent and runtime effects are not established.'))}</p><p>${esc(packet.status)} · ${packet.methods?.length||0} ${esc(t('retained method envelopes'))} · ${events.length} ${esc(t('retained events'))}</p><ul>${rows.map(e=>chromeHtml`<li><strong>${esc(e.detail?.kind||'UNKNOWN')}</strong> ${esc(e.detail?.condition||e.detail?.target||e.id)} ${threadEvidenceLinks(e.sourceIds||[])}</li>`).join('')}</ul><details><summary>${esc(t('Extraction frontiers and provenance'))} (${packet.frontier?.length||0})</summary><pre>${pretty({snapshot:packet.snapshot,packetDigest:packet.packetDigest,policy:packet.policy,query:packet.query,outcomes:packet.outcomes,frontier:packet.frontier,interpretationPlan:packet.interpretationPlan})}</pre></details></section>`;

function boundaryContractsCard(thread){

function serviceFragmentCard(fragment){

 collect(fragment.steps);

 const entrypoint=original.methods[fragment.entryMethod]?.entrypoint;

 return chromeHtml`<section id="${esc(fragment.id)}" tabindex="-1"><h2>${esc(fragment.title)} · ${esc(fragment.fragmentId)}</h2><p>${esc(t('Receiving service fragment from the same captured process; runtime delivery is unverified.'))}</p><p><a href="${esc(fragment.returnHref)}">${esc(t('Return to process at this fragment'))}</a>${operationLink}</p>${processThreadCard(thread).replace(/href="#(thread-[^"]+)"/g,(_,id)=>`href="${esc(threadAnchorHref(id))}"`)}</section>`;

function processThreadCard(thread){

  const method=methods[row.method],target=row.target?methods[row.target]:null;

  const citation=chromeHtml`<a class="source-link thread-citation" href="${esc(threadSourceHref(row.method,row.startLine))}" data-thread-end="${row.endLine}">${esc(t('Source'))} · ${esc(method?.source.service||'')}:${row.startLine}${row.endLine!==row.startLine?'–'+row.endLine:''}</a>`;

  const effects=row.effects?.length?chromeHtml`<div class="thread-effects"><h5>${esc(t('Selected declared effects'))}</h5><ul>${row.effects.map(effect=>chromeHtml`<li><span>${esc(t(effectKinds[effect.kind]||effect.kind))}</span> ${esc(effect.label)} ${cite(effect.citation)}</li>`).join('')}</ul><p>${esc(t('Effect labels are declarations; calls do not prove commit or delivery.'))}</p></div>`:'';

  const branch=row.branchGroup?chromeHtml`<section class="thread-branches"><p class="thread-branch-mode">${esc(t(branchModes[row.branchGroup.mode]))} · ${esc(t('Declared control interpretation'))}</p><div class="thread-branch-arms">${row.branchGroup.arms.map(arm=>chromeHtml`<section id="thread-step-${esc(arm.id)}" tabindex="-1"><h5>${esc(arm.condition??t('Otherwise'))}</h5>${arm.guard?cite(arm.guard):''}${steps(arm.steps||[])}</section>`).join('')}</div></section>`:'';

  return chromeHtml`<li id="thread-step-${esc(row.id)}" tabindex="-1"><article><div class="thread-step-meta"><span>${esc(method?.source.service||'')}</span><span>${esc(t(kinds[row.kind||'STEP']||'Step'))}</span>${crossService?chromeHtml`<span class="thread-boundary-badge">${esc(t('Delivery unverified'))}</span>`:''}</div><h4>${esc(row.title)}</h4><p>${esc(row.text)}</p><p class="thread-citations">${citation}${targetLink}</p>${pageLink}${effects}${branch}${row.children?.length?chromeHtml`<details class="thread-children"><summary>${esc(t('Detailed steps'))} (${row.children.length})<span class="thread-child-preview">${esc(preview)}</span></summary>${steps(row.children)}</details>`:''}</article></li>`;
 }).join('')+'</ul>';}
 const connections=[];

function analysisEvidence(){const tr=(en,ru)=>document.documentElement.lang==='ru'?ru:en;return `<section class="gap-card"><h3>${tr('Analysis evidence','Основания анализа')}</h3><p>${tr("Evidence from this publication's source check. Compiler facts enrich source interpretation; deployed behavior and narrative meaning remain separately assessed.",'Данные проверки исходного кода для этой публикации. Сведения компилятора уточняют разбор кода; поведение работающего сервиса и смысл описания оцениваются отдельно.')}</p>${Object.entries(D.analysisEvidence||{}).map(([id,e])=>`<h4>${esc(id)}</h4><p>${esc(e.coverage)} · ${tr('provider:','средство анализа:')} <strong>${esc(e.provider.status)}</strong> · ${e.mappedSymbols} ${tr('mapped semantic symbols','сопоставленных символов кода')}</p><p>${esc(e.provider.reason||'')} ${esc(e.provider.producer||e.extractor)} · ${tr('revision','версия')} ${esc(e.revision.slice(0,12))}</p>${e.provider.status==='NOT_REQUESTED'?`<p>${tr('Optional compiler enrichment was not requested for this service.','Дополнительный анализ компилятором не запрашивался для этого сервиса.')}</p>`:''}<details><summary>${tr('Provider details and example semantic facts','Сведения о средстве анализа и примеры фактов')}</summary><pre>${pretty(e)}</pre></details>`).join('')}</section>`;}

<script>(()=>{
 const ru=document.documentElement.lang==='ru',label=(en,ruText)=>ru?ruText:en;
 const header=document.querySelector('.reader-nav');
 if(header){const measure=()=>document.documentElement.style.setProperty('--reader-header-height',`${header.getBoundingClientRect().height}px`);measure();if(typeof ResizeObserver==='function')new ResizeObserver(measure).observe(header);}
 const main=document.querySelector('main.reader-guide');
 if(main&&!main.classList.contains('catalog-page')){
  const headings=[...main.querySelectorAll('h2')];
  if(headings.length>2){const layout=document.createElement('div');layout.className='guide-layout';main.before(layout);const nav=document.createElement('nav');nav.className='guide-toc';nav.setAttribute('aria-label',label('On this page','На этой странице'));const title=document.createElement('h2');title.textContent=label('On this page','На этой странице');nav.append(title);headings.forEach((h,i)=>{h.id=h.id||`guide-section-${i+1}`;const a=document.createElement('a');a.href=`#${h.id}`;a.textContent=h.textContent;nav.append(a);});layout.append(nav,main);}
 }
 const data=document.getElementById('catalog-data');
 if(data){const rows=JSON.parse(data.textContent),q=document.getElementById('catalog-query'),kind=document.getElementById('catalog-kind'),list=document.getElementById('catalog-results'),status=document.getElementById('catalog-status'),prev=document.getElementById('catalog-prev'),next=document.getElementById('catalog-next');let page=0;
  function readState(){const params=new URLSearchParams(location.search);q.value=params.get('q')||'';kind.value=params.get('kind')||'';const requested=Number(params.get('page'));page=Number.isSafeInteger(requested)&&requested>0?requested-1:0;}
  function syncUrl(push=false){const params=new URLSearchParams(location.search);if(q.value.trim())params.set('q',q.value.trim());else params.delete('q');if(kind.value)params.set('kind',kind.value);else params.delete('kind');if(page>0)params.set('page',String(page+1));else params.delete('page');const search=params.toString(),url=`${location.pathname}${search?`?${search}`:''}${location.hash||''}`;if(push)history.pushState(history.state,'',url);else history.replaceState(history.state,'',url);}
  function render(){const query=q.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);const matched=rows.filter(r=>{const terms=Array.isArray(r.searchText)?r.searchText.join(' '):(r.searchText||'');const haystack=`${r.title} ${r.displayTitle||''} ${r.id} ${r.kind} ${r.context||''} ${r.summary||''} ${terms}`.toLocaleLowerCase();return(!kind.value||r.kind===kind.value)&&query.every(term=>haystack.includes(term));});const pages=Math.max(1,Math.ceil(matched.length/20));page=Math.max(0,Math.min(page,pages-1));list.replaceChildren();matched.slice(page*20,page*20+20).forEach(r=>{const li=document.createElement('li'),a=document.createElement('a'),meta=document.createElement('small');const displayTitle=typeof r.displayTitle==='string'&&r.displayTitle.trim()?r.displayTitle:null;a.href=r.href;a.textContent=displayTitle||r.title;const types={Service:label('Service','Сервис'),Process:label('Process','Процесс'),Dataflow:label('Dataflow','Движение данных'),API:'API',Entrypoint:label('Entry point','Точка входа'),'Source declaration':label('Source declaration','Объявление в исходном коде'),Entity:label('Entity','Сущность')};const coverage={authored:label('Description present','Описание есть'),inventory:label('No description','Без описания'),unavailable:label('Evidence or translation gap','Есть пробелы')};meta.className='catalog-meta';meta.textContent=[types[r.kind]||r.kind,r.context,displayTitle?null:r.id,coverage[r.coverage]].filter(Boolean).join(' · ');li.append(a,meta);if(r.summary){const detail=document.createElement('small');detail.className='catalog-detail';detail.textContent=Array.isArray(r.summary)?r.summary.join(' · '):r.summary;li.append(detail);}if(Array.isArray(r.relatedLinks)&&r.relatedLinks.length){const related=document.createElement('small');related.className='catalog-detail';r.relatedLinks.forEach((entry,i)=>{const link=document.createElement('a');link.href=entry.href;link.textContent=entry.title;related.append(link);if(i<r.relatedLinks.length-1)related.append(document.createTextNode(' · '));});li.append(related);}if(displayTitle){const identity=document.createElement('details'),heading=document.createElement('summary');identity.className='catalog-identity';heading.textContent=label('Exact identity','Точный идентификатор');identity.append(heading);for(const [name,value] of [[label('Title','Заголовок'),r.title],[label('ID','Идентификатор'),r.id]]){const row=document.createElement('small'),code=document.createElement('code');row.append(document.createTextNode(`${name}: `));code.textContent=value;row.append(code);identity.append(row);}li.append(identity);}list.append(li);});status.textContent=matched.length?(ru?`Найдено: ${matched.length} · страница ${page+1} из ${pages}`:`${matched.length} results · page ${page+1} of ${pages}`):label('No matching results. Try another search or type.','Совпадений нет. Попробуйте другой запрос или тип.');prev.disabled=page===0;next.disabled=page>=pages-1;}
  q.addEventListener('input',()=>{page=0;render();syncUrl();});kind.addEventListener('change',()=>{page=0;render();syncUrl(true);});prev.addEventListener('click',()=>{page--;render();syncUrl(true);});next.addEventListener('click',()=>{page++;render();syncUrl(true);});
  if(typeof addEventListener==='function')addEventListener('popstate',()=>{readState();render();syncUrl();});
  readState();render();syncUrl();
  for(const id of ['catalog-processes']){const fallback=document.getElementById(id);if(fallback)fallback.hidden=true;}
  for(const id of ['catalog-controls','catalog-pager']){const controls=document.getElementById(id);if(controls)controls.hidden=false;}

 }
 document.querySelectorAll('.reader-links a').forEach(a=>{if(new URL(a.href).pathname===location.pathname)a.setAttribute('aria-current','page');});
})();

/* Reader explanations only; original evidence codes and authority remain unchanged. */
(()=>{

  AMBIGUOUS_SOURCE_DETAIL:["Неоднозначные сведения об исходном коде", "Допустимо несколько толкований или совпадений. Ни одно нельзя считать установленным поведением.", "Откройте подтверждающий фрагмент, сузьте операцию или добавьте недостающий код."],
  ANNOTATION_DECLARATION_UNAVAILABLE:["Определение аннотации недоступно", "Использование аннотации найдено, но её определение недоступно. Имя не устанавливает полный смысл.", "Добавьте определение или восстановите зависимости компилятора."],
  DIALECT_DECLARED_NOT_COMPILER_VALIDATED:["Версия языка только заявлена", "Настройка версии направляет синтаксический разбор. Компилятор не проверял проект с этой версией.", "Проверьте окружение репозитория и выберите совместимый профиль компилятора."],
  NODE_BUDGET_EXHAUSTED:["Достигнут предел числа узлов", "Обход остановлен по ограничению размера. Отсутствие следующих шагов не означает, что сервис их не выполняет.", "Разделите процесс на сценарии или измените maxNodes и повторите исследование."],

  NO_BEAN_OWNER:["Владелец компонента Spring не установлен", "Анализ не установил компонент-владелец. Это не доказывает отсутствие метода при выполнении.", "Проверьте аннотации класса, настройки и доступность сведений об аннотациях."],
  ORDER_LEXICAL_ONLY:["Порядок следует тексту кода", "Шаги расположены по тексту. Асинхронное выполнение, обратные вызовы и параллельная работа могут изменить порядок.", "Обозначьте асинхронные границы и получите наблюдения выполнения, если порядок важен."],
  OUTBOUND_FEIGN_CLIENT_NOT_SERVER_ENTRYPOINT:["HTTP-клиент не является точкой входа сервера", "Объявление описывает исходящий клиент Feign, а не входящий маршрут приложения.", "Опишите его в исходящих контрактах и отдельно укажите сервер."],
  RUNTIME_REGISTRATION_UNPROVEN:["Активация при выполнении не проверена", "Код показывает возможный обработчик, но активные профили, условия и настройки развёртывания не наблюдались.", "Добавьте датированные настройки или наблюдения выполнения как отдельные подтверждения."],
  SCOPE_WATCH_CONSERVATIVE:["Область проверки актуальности шире изменения поведения", "Изменение наблюдаемого кода может пометить текст устаревшим, даже если поведение не изменилось.", "Изучите различия перед обновлением объяснения."],
  SOURCE_ANNOTATION_NAME_UNRESOLVED:["Полное имя аннотации не определено", "Синтаксический разбор не установил полное имя аннотации. Совпадения короткого имени недостаточно.", "Проверьте импорты или используйте сведения компилятора."],
  SOURCE_INHERITANCE_UNRESOLVED:["Наследуемое поведение не определено", "Синтаксический разбор не устанавливает все отношения наследования и переопределения.", "Добавьте соответствующие классы и совместимый анализатор компилятора."],
  SOURCE_NAMES_NOT_COMPILER_RESOLVED:["Имена прочитаны из текста кода", "Идентификаторы получены синтаксически. Совпадение имён не доказывает тождество символов.", "Используйте K2 или Javac, если важны точные символы, типы или перегрузки."],
  UNRESOLVED_ANNOTATION_VALUE:["Значение аргумента аннотации не определено", "Доступных данных недостаточно для вычисления значения. Зависящий от него маршрут или условие может быть неполным.", "Проверьте константы, подстановки и настройки; используйте сведения компилятора, где возможно."],
  PUBLIC_BOUNDARY_INVENTORY_IS_BOUNDED_BY_SELECTED_MODULES:["Точки входа найдены только выбранными модулями анализа", "Перечень содержит распознанные включёнными модулями точки входа и не охватывает все возможные точки входа при выполнении.", "Проверьте выбор модулей и сохраняйте неизвестность для динамических маршрутов."],
  DYNAMIC_REGISTRATION_AND_RUNTIME_ACTIVATION_UNVERIFIED:["Динамическая регистрация не проверена", "Создаваемые при выполнении обработчики и фактическая активация не входят в сохранённые статические данные.", "Добавьте настройки развёртывания или наблюдения выполнения."],
  SOURCE_EVIDENCE_UNAVAILABLE:["Подтверждающий код недоступен", "Нужный код не удалось сохранить. Объяснения нельзя обновить на его основании.", "Проверьте локальные привязки, выбранные версии и диагностику."],
  FILE_ONLY:["Файл сохранён без структурного анализа", "Точный текст сохранён, но структурированные сведения из него не извлечены. Файл пригоден для чтения и объяснения.", "Откройте файл; выберите подходящий модуль анализа, если формат поддерживается."],
  DECLARED_TRANSITION_NOT_REACHED:["Заявленная связь сервисов не достигнута", "Связь есть в каталоге, но обход от выбранного начала процесса её не достиг. Объявление не доказывает сквозной путь выполнения.", "Проверьте начало процесса и данные отправителя и получателя. Разделите асинхронные этапы и явно свяжите их описания."]
 };
 const definitions={
  CALL_TARGETS_UNRESOLVED:['Call destinations are unresolved','The source contains a call, but this capture does not identify its exact target. A sequence can show a lexical call without proving dispatch or overload selection.','Use an admitted K2 or Javac provider, then inspect whether this particular call resolves.'],
  AMBIGUOUS_SOURCE_DETAIL:['Some source details are ambiguous','More than one source interpretation or match is possible. The reader cannot safely select one as established behavior.','Open the supporting fragment and narrow the selected operation or supply missing source.'],
  ANNOTATION_DECLARATION_UNAVAILABLE:['An annotation definition is unavailable','The annotation use was captured, but its declaration was not available for analysis. Its full semantics cannot be inferred from its name.','Include the defining source or restore compiler dependencies.'],
  DIALECT_DECLARED_NOT_COMPILER_VALIDATED:['Language version is declared only','The configured language dialect guides syntax inspection. A compiler has not validated this project against that version.','Use repository doctor and a compatible compiler profile if language semantics matter.'],
  NODE_BUDGET_EXHAUSTED:['The selected flow reached its size limit','Traversal stopped at the configured node budget. The displayed path is incomplete; absence of a later step does not mean the service never performs it.','Narrow the process into smaller scenarios, link child views, or deliberately adjust the process maxNodes limit and inspect again.'],
  DEPTH_BUDGET_EXHAUSTED:['The selected flow reached its depth limit','Traversal stopped at the configured call depth. Deeper behavior is outside this result.','Save a focused child process or adjust maxDepth within the supported budget.'],
  NO_BEAN_OWNER:['A Spring bean owner was not established','The framework analysis did not establish an owning bean for this candidate. It does not prove that the method is absent at runtime.','Inspect class annotations and configuration, and check whether the required annotation facts are available.'],
  ORDER_LEXICAL_ONLY:['Order follows the written source','Steps follow their syntactic placement. Async execution, callbacks, concurrent work and runtime scheduling may have a different order.','Describe async boundaries explicitly and obtain runtime evidence when execution order is the question.'],
  OUTBOUND_FEIGN_CLIENT_NOT_SERVER_ENTRYPOINT:['An HTTP client is not a server endpoint','This declaration describes an outbound Feign client. It must not be presented as an incoming route served by this application.','Document it under outgoing contracts and identify the server separately.'],
  RUNTIME_REGISTRATION_UNPROVEN:['Runtime activation is unverified','Source or compiler facts show a possible handler, but active profiles, conditions and deployment wiring have not been observed.','Add dated configuration or runtime observations as separate evidence.'],
  SCOPE_WATCH_CONSERVATIVE:['Freshness checks use a conservative scope','A change in the watched source scope can mark content stale even when its business behavior is unchanged.','Review the reported difference before refreshing the affected explanation.'],
  SOURCE_ANNOTATION_NAME_UNRESOLVED:['An annotation name is unresolved','Syntax inspection could not establish the fully qualified annotation identity. A similar short name is not sufficient framework evidence.','Inspect imports or use compiler annotation facts.'],
  SOURCE_INHERITANCE_UNRESOLVED:['Inherited behavior is unresolved','This syntax capture does not resolve the complete inheritance or override relationship.','Include the relevant classes and use a compatible compiler provider.'],
  SOURCE_NAMES_NOT_COMPILER_RESOLVED:['Names come from source syntax','Identifiers were read from source text rather than resolved by a compiler. Equal names alone do not prove equal symbols.','Use K2 or Javac when exact symbol identity, inferred types or overloads matter.'],
  UNRESOLVED_ANNOTATION_VALUE:['An annotation argument is unresolved','An annotation value could not be evaluated from the available facts. A route or condition depending on it may remain incomplete.','Inspect constants, placeholders and configuration; use compiler facts where supported.'],
  PUBLIC_BOUNDARY_INVENTORY_IS_BOUNDED_BY_SELECTED_MODULES:['Only selected modules discover entry points','This inventory includes what the enabled analysis modules recognize. It is not a universal inventory of all runtime entry points.','Inspect module selection and preserve unknown framework or dynamic routes.'],
  DYNAMIC_REGISTRATION_AND_RUNTIME_ACTIVATION_UNVERIFIED:['Dynamic registration is unverified','Runtime-created handlers and effective activation are outside the captured static evidence.','Supply deployment configuration or runtime observations.'],
  SOURCE_EVIDENCE_UNAVAILABLE:['Source evidence is unavailable','The required source could not be captured, so related explanations cannot be refreshed from it.','Check local bindings, selected revisions and the reported diagnostic.']
 };
 const decode=(code)=>{
  const key=code.split(':')[0];
  if(ru)return russian[key]||[code,'Это ограничение доступных данных, а не подтверждённая ошибка сервиса.','Изучите код ограничения и подтверждающие исходные данные. Неизвестный код требует проверки.'];
  if(key==='FILE_ONLY')return ['File retained without structured analysis','The exact file is retained, but this capture did not extract structured semantic facts from it. It can still support a manual source reading.','Open the file; select a relevant module when one supports this format.'];
  if(key==='DECLARED_TRANSITION_NOT_REACHED')return ['A declared service link was not reached','The catalogue contains this link, but traversal from the selected process root did not reach it. The declaration is not proof of an executable end-to-end path.','Inspect the process root and producer/consumer evidence. Split asynchronous stages and link their explanations explicitly.'];
  return definitions[key]||[code.includes(' ')?code:code.toLowerCase().replaceAll('_',' '),'This item limits the scope of the captured evidence. It is not, by itself, a confirmed defect in the application.','Inspect the exact code below and the supporting source. An unrecognized code needs investigation; do not infer a stronger guarantee.'];
 };
 let serial=0;
 function item(code){const [label,meaning,next]=decode(code),li=document.createElement('li'),text=document.createElement('span'),wrap=document.createElement('span'),button=document.createElement('button'),tip=document.createElement('span'),raw=document.createElement('code');text.textContent=label;wrap.className='limit-help';button.type='button';button.textContent='?';button.setAttribute('aria-label',`${tr('Explain','Пояснение')}: ${label}`);tip.id=`limit-tip-${++serial}`;tip.className='limit-tip';tip.setAttribute('role','tooltip');tip.textContent=`${meaning} ${tr('Next','Следующий шаг')}: ${next}`;raw.textContent=code;tip.append(raw);button.setAttribute('aria-describedby',tip.id);button.setAttribute('aria-expanded','false');wrap.append(button,tip);li.append(text,wrap);if(code.startsWith('FILE_ONLY:')){const path=document.createElement('code');path.textContent=' '+code.slice(10);li.append(path);}return li;}
 function enrich(){document.querySelectorAll('#scenario-content h3').forEach(h=>{if(!['Evidence limits','Ограничения анализа','Ограничения данных','Границы доказательств'].includes(h.textContent)||h.parentElement.dataset.limitsReady)return;const section=h.parentElement,list=section.querySelector(':scope > ul');if(!list)return;section.dataset.limitsReady='true';const codes=[...list.children].map(li=>li.textContent.trim());const intro=document.createElement('p');intro.className='limit-intro';intro.textContent=tr('These limits describe what this analysis can establish. They are not a list of service defects. Use ? for meaning, impact and next steps.','Ограничения описывают, что может установить этот анализ. Это не список ошибок сервиса. Кнопка ? поясняет смысл, последствия и дальнейшие действия.');h.after(intro);list.className='limit-list';list.replaceChildren();const files=codes.filter(c=>c.startsWith('FILE_ONLY:'));codes.filter(c=>!c.startsWith('FILE_ONLY:')).forEach(c=>list.append(item(c)));if(files.length){const details=document.createElement('details'),summary=document.createElement('summary'),ul=document.createElement('ul');details.className='limits-files';summary.textContent=ru?`Файлов без структурного анализа: ${files.length}`:`${files.length} files retained without structured analysis`;ul.className='limit-list';files.forEach(c=>ul.append(item(c)));details.append(summary,ul);section.append(details);}});}
 document.addEventListener('click',e=>{const button=e.target.closest('.limit-help > button');document.querySelectorAll('.limit-help[data-open=true]').forEach(w=>{if(!button||w!==button.parentElement){w.dataset.open='false';w.querySelector('button').setAttribute('aria-expanded','false');}});if(button){const wrap=button.parentElement;delete wrap.dataset.dismissed;wrap.dataset.open=wrap.dataset.open!=='true'?'true':'false';if(wrap.dataset.open==='false')wrap.dataset.dismissed='true';button.setAttribute('aria-expanded',wrap.dataset.open);}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.limit-help').forEach(w=>{w.dataset.open='false';w.dataset.dismissed='true';w.querySelector('button').setAttribute('aria-expanded','false');});});
 document.addEventListener('focusin',e=>{const w=e.target.closest('.limit-help');if(w)delete w.dataset.dismissed;});
 document.addEventListener('mouseover',e=>{const w=e.target.closest('.limit-help');if(w&&!w.contains(e.relatedTarget))delete w.dataset.dismissed;});
 const content=document.getElementById('scenario-content');if(content){new MutationObserver(enrich).observe(content,{childList:true,subtree:true});enrich();}
})();
</script></body></html>
