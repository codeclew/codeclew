<svg xmlns="http://www.w3.org/2000/svg" width="840" height="690" viewBox="0 0 840 690" role="img" aria-labelledby="title desc">
  <title id="title">Proposed Codeclew language and framework packages</title>
  <desc id="desc">Kotlin and Java compiler packs export sealed JVM facts. A single Spring package derives framework facts while existing code analysis preserves calls and bodies. Entry points and documentation combine them using exact identities. All arrows are proposed data dependencies, not proven execution paths.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#61748d"/></marker></defs>
  <rect width="840" height="690" rx="16" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="420" y="39" font-size="24" font-weight="700" fill="#172b4d">One Spring interpreter, multiple compiler packs</text>
    <text x="420" y="64" font-size="14" fill="#53627b">Proposal · data dependencies · evidence mapping E1–E8 in the analysis</text>
    <g fill="none" stroke="#61748d" stroke-width="2" marker-end="url(#arrow)">
      <path d="M215 164V183H360V205"/><path d="M625 164V183H480V205"/>
      <path d="M360 283V308H215V330"/><path d="M480 283V308H625V330"/>
      <path d="M215 408V442"/><path d="M215 520V543H360V569"/>
      <path d="M625 408V543H480V569"/>
    </g>
    <g stroke="#b6c8e0" fill="#e8f0fc">
      <rect x="60" y="90" width="310" height="74" rx="10"/>
      <rect x="470" y="90" width="310" height="74" rx="10"/>
      <rect x="230" y="205" width="380" height="78" rx="10"/>
      <rect x="470" y="330" width="310" height="78" rx="10"/>
    </g>
    <g stroke="#91bcaf" fill="#e4f3ed">
      <rect x="60" y="330" width="310" height="78" rx="10"/>
      <rect x="60" y="442" width="310" height="78" rx="10"/>
      <rect x="230" y="569" width="380" height="78" rx="10"/>
    </g>
    <g fill="#172b4d" font-size="18" font-weight="700">
      <text x="215" y="120">P1 · Kotlin compiler packs</text><text x="625" y="120">P1 · Java compiler pack</text>
      <text x="420" y="236">P2 · Sealed JVM facts</text><text x="215" y="361">P3 · One Spring package</text>
      <text x="625" y="361">P4 · Existing code analysis</text><text x="215" y="473">P5 · Derived framework facts</text>
      <text x="420" y="600">P6 · Entry points and documentation</text>
    </g>
    <g fill="#425775" font-size="14">
      <text x="215" y="145">Version-specific FIR bridges: 2.1 / 2.3 / 2.4</text><text x="625" y="145">Resolved identities, values and relationships</text>
      <text x="420" y="261">Annotation uses, definitions, defaults and hierarchy</text><text x="215" y="387">Versioned framework rules, no compiler API</text>
      <text x="625" y="387">Preserve calls, bodies and flow evidence</text><text x="215" y="499">Origins, derivation and explicit boundaries</text>
      <text x="420" y="626">Join exact identities; retain runtime uncertainty</text>
      <text x="420" y="675">Missing inputs remain visible limits. Framework results do not prove live registration.</text>
    </g>
  </g>
</svg>
