hypotheses:
  - id: "H01"
    hypothesis: "Semantic model остаётся полезной lossy projection."
    pass: "100% product-derived fact types имеют used query/constraint/decision, rebuild source и boundary; full derived store rebuild даёт эквивалентные registered query results; anti-duplication test пройден."
    conditional: "Ограниченная executable specification только для явно owned critical scope."
    falsifier: "Модель воспроизводит большую часть externally observable behavior без source, содержит orphan fact types или требует ручного дублирования transition logic."
    destination_nodes: ["R03", "K01", "Q03", "X03", "X04", "GF"]
    decision_gates: ["GK", "GF"]
  - id: "H02"
    hypothesis: "Stable identity и invalidation безопасны в supported contour."
    pass: "Zero silent retargeting; SAME/RENAMED/MOVED/SPLIT/MERGED/DELETED/AMBIGUOUS корректны; ambiguity блокирует publication."
    conditional: "Неоднозначность явно приводит к refuse/reslice."
    falsifier: "Silent retargeting или stale fact используется как fresh."
    destination_nodes: ["R03", "D01", "K02", "K03", "E02", "E06", "M01", "M03", "Q02", "X02", "X03", "X04", "GF"]
    decision_gates: ["GK", "GES", "GE2", "GM", "GF"]
  - id: "H03"
    hypothesis: "Multi-level L0–L5 projections сокращают model context."
    pass: "Context 16–32 KiB, typical goal <=1 KiB, обязательная closure не усечена; 10× padding не выводит context за budget."
    conditional: "PARTIAL_BUDGET с корректным отказом."
    falsifier: "Context растёт с repository LOC либо upper-level claim не имеет provenance."
    destination_nodes: ["R02", "D01", "D02", "K04", "E01", "E02", "E04", "E07", "X00", "X01", "X02", "X03", "X04", "GF"]
    decision_gates: ["GE1", "GE2", "GF"]
  - id: "H04"
    hypothesis: "Semantic binding позволяет отказаться от grep workflow."
    pass: "100% Codeclew runs соблюдают frozen query allowlist/cumulative caps: semantic resolution или explicit refusal без fallback; independently weighted applicability >=60%; correct binding >=90%; false complete 0; must-refuse 100%."
    conditional: "Applicability 40–59,99%: одна preregistered binder-only итерация."
    falsifier: "Applicability <40%, task-derived lexical query вне one-shot bootstrap, widening/over-budget, decoy-sensitive binding или fallback search."
    destination_nodes: ["R02", "D01", "D02", "K04", "E01", "E02", "E03", "E04", "E07", "X00", "X01", "X02", "X03", "X04", "GF"]
    decision_gates: ["GE1", "GE2", "GF"]
  - id: "H05"
    hypothesis: "Grep-free semantic editing существенно дешевле single-agent default/AST."
    pass: "Accepted correctness non-inferior к лучшему baseline по δ=5 п.п.; accepted win rate >=70%; median E2E -30%, noncached tokens -30%, raw tokens -40% против каждого baseline; 95% CI исключает отсутствие cost выигрыша."
    conditional: "Correctness NI, но одна cost-метрика/CI не достигнута: NARROW/INCONCLUSIVE."
    falsifier: "Correctness не проходит NI, safety violation или model пишет low-level source plan в большинстве applicable tasks."
    destination_nodes: ["R02", "D01", "D02", "E01", "E03", "E07", "X00", "X01", "X02", "X03", "X04", "GF"]
    decision_gates: ["GE2", "GF"]
  - id: "H06"
    hypothesis: "PSI-native materialization безопасна."
    pass: "False commit 0; must-refuse до candidate 100%; no textual edit path chosen family; goal-wide CAS/recovery green."
    conditional: "Unsupported query/framework boundary — explicit refusal."
    falsifier: "Text/source-shape recipe обязателен для generalization или incorrect commit."
    destination_nodes: ["R02", "D01", "D02", "E01", "E03", "E05", "E06", "E07", "X00", "X01", "X02", "X03", "X04", "GF"]
    decision_gates: ["GES", "GE2", "GF"]
  - id: "H07"
    hypothesis: "Semantic MVCC раньше обнаруживает supported conflicts."
    pass: "Detection uplift >=20 п.п. против MA-AST; FN 0; FP <10% для preregistered text/symbol/signature/project-model/declared-assumption/explicit-resource classes."
    conditional: "FP 10–15%: одна detector iteration, новый withheld set."
    falsifier: "Uplift <20 п.п., FP >15% или любой FN supported class."
    destination_nodes: ["D03", "K04", "M01", "M04", "M05", "M06", "Q02", "X00", "X01", "X02", "X03", "X04", "GF"]
    decision_gates: ["GM", "GF"]
