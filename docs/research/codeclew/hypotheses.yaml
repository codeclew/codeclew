    pass: "<=20% resolved episodes требуют only-free-text; каждый dialogue result materialized typed decision/obligation."
    conditional: ">20% и <=30% — narrow/iterate."
    falsifier: ">30% resolved episodes не получают useful semantic artifact."
    destination_nodes: ["D03", "M02", "M03", "M05", "M06", "Q02", "Q03", "X00", "X01", "X02", "X03", "X04", "GF"]
    decision_gates: ["GM", "GF"]
