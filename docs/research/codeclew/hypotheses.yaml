    pass: "Accepted integration time -25%; human interventions -30%; noncached tokens -30%; raw tokens -40% против MA-default и MA-AST; accepted outcome NI по δ=5 п.п.; paired 95% CI primary ratios ниже 1.0."
    conditional: "Human reduction [20%,30%), integration [20%,25%), positive token direction below target или CI пересекает no-benefit: NARROW/confirmatory series."
    falsifier: "Human или integration improvement <20%, token advantage <=0, correctness не проходит NI или safety violation."
    destination_nodes: ["D03", "M04", "M05", "M06", "Q02", "X00", "X01", "X02", "X03", "X04", "GF"]
    decision_gates: ["GM", "GF"]
