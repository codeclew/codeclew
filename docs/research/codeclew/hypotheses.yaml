    pass: "На frozen mutant set supported routing recall 100%, median selected test time <=70% run-all, omission/wrong-order mutant kill 100%, accepted correctness non-inferior; ranking не называется probability."
    conditional: "Экономии нет, но evidence links/mutation gate безопасны: NARROW_TO_EVIDENCE."
