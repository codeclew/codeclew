    falsifier: "Любой latency p95 >=5 s, >10% sampled facts stale или service ухудшает Git workflow."
    destination_nodes: ["R03", "D03", "K03", "M01", "M03", "M06", "Q02", "Q03", "X00", "X01", "X02", "X03", "X04", "GF"]
