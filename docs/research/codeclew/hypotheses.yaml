    hypothesis: "Coordination не мешает независимой работе."
    pass: "Independent-task coordination overhead <20%, paired 95% CI upper bound <20%; disjoint work не сериализуется; correctness non-inferior."
    conditional: "Point estimate ровно/ниже 20%, но CI пересекает 20%: inconclusive, новый preregistered run."
    falsifier: "Point estimate >20% или lost parallelism/correctness."
    destination_nodes: ["D03", "M01", "M02", "M04", "M05", "M06", "Q02", "Q03", "X00", "X01", "X02", "X03", "X04", "GF"]
    decision_gates: ["GM", "GF"]
