[workspace]
resolver = "2"
members = ["crates/clew"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2"
hex = "0.4"
prost = "0.14"
crossbeam-channel = "0.5"
rayon = "1.10"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tempfile = "3.23"
thiserror = "2.0"
uuid = { version = "1.19", features = ["v4", "serde"] }
walkdir = "2.5"
