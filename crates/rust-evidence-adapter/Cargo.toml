[package]
name = "rust-evidence-adapter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust-owned Codeclew evidence adapter"

# Keep this adapter outside the parent workspace until the Kotlin decision core is frozen.
[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
protobuf = "3.7"
scip = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "codeclew-rust-evidence-adapter"
path = "src/main.rs"

