import groovy.json.JsonOutput
import java.security.MessageDigest
import java.util.jar.JarFile
import org.gradle.api.tasks.StopExecutionException
import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.tasks.compile.JavaCompile

gradle.beforeProject { project ->
    def requestedCompileTask = System.getProperty("semantic.thread.compileTask", "compileKotlin")
    def captureRevision = System.getProperty("semantic.thread.nativeCaptureRevision")
    def captureTask = System.getProperty("semantic.thread.nativeCaptureTask")
    def springCompile = null
    def capturedInputs = null
    def digestFile = { File file ->
        def digest = MessageDigest.getInstance("SHA-256")
        file.withInputStream { stream ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        "sha256:" + digest.digest().encodeHex().toString()
    }
    def springInputs = { compile ->
        def repo = project.rootDir.canonicalFile.toPath()
        def sources = [kotlin: compile.sources.files, java: compile.javaSources.files].collectEntries { kind, files ->
            [kind, files.collectEntries { file ->
                def path = file.canonicalFile.toPath()
                if (!path.startsWith(repo) || !file.isFile()) throw new IllegalStateException("Unavailable compilation source")
                [repo.relativize(path).toString().replace('\\', '/'), digestFile(file)]
            }.sort()]
        }
        return [sources: sources, classpath: compile.libraries.files.collect { file ->
            if (file.isFile()) return digestFile(file)
            if (!file.isDirectory()) throw new IllegalStateException("Unavailable native classpath")
            return project.fileTree(file).files.collectEntries { child ->
                [file.toPath().relativize(child.toPath()).toString(), digestFile(child)]
            }.sort()
        }]
    }
    def springPlan = { compile ->
        if (!(captureRevision ==~ /(?:[a-f0-9]{40}|[a-f0-9]{64})/) || gradle.gradleVersion != "8.14.1" ||
            compile?.name != "compileKotlin" || compile.path != captureTask ||
            !project.pluginManager.hasPlugin("org.jetbrains.kotlin.kapt") ||
            !project.pluginManager.hasPlugin("org.jetbrains.kotlin.plugin.spring")) return null
        try {
            if (compile.class.superclass.name != "org.jetbrains.kotlin.gradle.tasks.KotlinCompile" ||
                compile.class.superclass.package.implementationVersion != "2.2.21-release-469" ||
                compile.compilerOptions.jvmTarget.get().target != "21" ||
                Runtime.version().feature() != 21 ||
                !compile.compilerOptions.freeCompilerArgs.get().isEmpty()) return null
            def toolchain = compile.kotlinJavaToolchainProvider.get()
            def getters = toolchain.class.methods.findAll { method -> method.parameterCount == 0 &&
                (method.name == "getJavaExecutable" || method.name.startsWith('getJavaExecutable$')) }
            if (getters.size() != 1) return null
            def release = new File(getters[0].invoke(toolchain).get().asFile.canonicalFile.parentFile.parentFile, "release")
            if (!release.readLines().any { it ==~ /JAVA_VERSION="21(?:[.+-][^"]*)?"/ }) return null
            def options = compile.pluginOptions.get().collectMany { container ->
                container.allOptions().collectMany { id, entries ->
                    entries.collect { option ->
                        if (option.class.name != "org.jetbrains.kotlin.gradle.plugin.SubpluginOption") {
                            throw new IllegalStateException("Unsupported plugin option type")
                        }
                        "plugin:${id}:${option.key}=${option.value}".toString()
                    }
                }
            }
            if (options != ["plugin:org.jetbrains.kotlin.allopen:preset=spring"]) return null
            def knownRegistrars = [
                "kotlin-allopen-compiler-plugin-embeddable-2.2.21.jar": "sha256:18b6d84f93899f09daffc7b104f8c4333cd78fe0b8d8ac58434c93d9f4e77e47",
                "kotlin-annotation-processing-gradle-2.2.21.jar": "sha256:8007c7ba142d8e0623e3cc3ec0f6191cb0f83c8c67d4384caedf977b3c5e7718",
                "kotlin-scripting-compiler-embeddable-2.2.21.jar": "sha256:d934b9d0c246bc09624b7068af58ad57cef11dbe2addbc7b19d250cce42de1c9",
            ]
            def registrars = [:]
            def plugins = compile.pluginClasspath.files.collect { file ->
                def hash = digestFile(file)
                new JarFile(file).withCloseable { jar ->
                    if (["CompilerPluginRegistrar", "ComponentRegistrar", "CommandLineProcessor"].any { name ->
                        jar.getJarEntry("META-INF/services/org.jetbrains.kotlin.compiler.plugin." + name) != null
                    }) {
                        if (knownRegistrars[file.name] != hash || registrars.put(file.name, hash) != null) {
                            throw new IllegalStateException("Unqualified plugin artifact")
                        }
                    }
                }
                [name: file.name, digest: hash]
            }
            if (registrars != knownRegistrars) return null
            def compilerPaths = compile.properties.findAll { key, value -> key.startsWith('defaultCompilerClasspath$') }
            if (compilerPaths.size() != 1) return null
            def compiler = compilerPaths.values().first().files.collect { [name: it.name, digest: digestFile(it)] }
            if (!compiler || compiler[0] != [name: "kotlin-compiler-embeddable-2.2.21.jar",
                digest: "sha256:9588fa696ac5507af764fd5660df6894185e12704ec1bc3f5cb772af4987f295"]) return null
            return [revision: captureRevision, compileTask: compile.path, options: options,
                requestedPluginArtifacts: plugins, compilerArtifacts: compiler]
        } catch (Exception ignored) { return null }
    }
    if (captureTask != null && captureTask == (project.path == ":" ? ":${requestedCompileTask}" : "${project.path}:${requestedCompileTask}")) {
        gradle.projectsEvaluated {
            def compile = project.tasks.findByName(requestedCompileTask)
            springCompile = springPlan(compile)
            if (springCompile != null) {
                compile.outputs.upToDateWhen { false }
                compile.outputs.doNotCacheIf("Codeclew requires an executed native compilation") { true }
                compile.doFirst {
                    def destination = compile.destinationDirectory.get().asFile.canonicalFile
                    if (!destination.toPath().startsWith(new File(project.projectDir, "build").toPath()) ||
                        project.fileTree(destination).matching { include "**/*.class" }.files ||
                        springCompile != springPlan(compile)) {
                        throw new StopExecutionException("Codeclew native compilation inputs are stale")
                    }
                    capturedInputs = springInputs(compile)
                }
                gradle.taskGraph.afterTask { task, state ->
                    if (task == compile && state.failure != null) {
                        println "__SEMANTIC_THREAD_NATIVE_COMPILE_FAILED__"
                    }
                }
            }
        }
    }
    def sourceSetNameOf = { compile ->
        if (compile.name.startsWith("compile") && compile.name.endsWith("Kotlin")) {
            def stem = compile.name.substring("compile".length(), compile.name.length() - "Kotlin".length())
            return stem.isEmpty() ? "main" : stem.substring(0, 1).toLowerCase() + stem.substring(1)
        }
        return "main"
    }
    def selectedClasspathProvider = { compile ->
        try {
            def libraries = compile.property("libraries")
            if (libraries != null && !libraries.files.isEmpty()) return libraries
        } catch (Throwable ignored) {}
        def sourceSetName = sourceSetNameOf(compile)
        def configurationName = sourceSetName == "main" ? "compileClasspath" : sourceSetName + "CompileClasspath"
        try {
            def configuration = project.configurations.findByName(configurationName)
            if (configuration != null && !configuration.files.isEmpty()) return configuration
        } catch (Throwable ignored) {}
        return null
    }
    def selectedJavaSourceProducers = { compile, modelTask ->
        def sourceSets = project.extensions.findByType(SourceSetContainer)
        def sourceSet = sourceSets?.findByName(sourceSetNameOf(compile))
        if (sourceSet == null || sourceSet.getCompileTaskName("kotlin") != compile.name) return []
        def javaCompile = project.tasks.findByName(sourceSet.compileJavaTaskName)
        if (!(javaCompile instanceof JavaCompile)) return []

        // Match declared outputs to source roots even when no Java files exist
        // yet. The Java compiler itself and unrelated build work are excluded.
        def roots = sourceSet.java.srcDirs.collect { it.toPath().toAbsolutePath().normalize() }
        if (roots.isEmpty()) return []
        def blocked = [compile, javaCompile, modelTask] as Set
        def direct = new LinkedHashMap()
        def prerequisitesOf = { task ->
            direct.computeIfAbsent(task) { task.taskDependencies.getDependencies(task) }
        }
        def closure = { tasks ->
            def pending = new ArrayDeque(tasks)
            def visited = new LinkedHashSet()
            while (!pending.isEmpty()) {
                def next = pending.removeFirst()
                if (visited.add(next) && !blocked.contains(next)) {
                    pending.addAll(prerequisitesOf(next))
                }
            }
            return visited
        }
        return closure(prerequisitesOf(javaCompile)).findAll { task ->
            if (blocked.contains(task)) return false
            def producesJavaSources = task.outputs.files.files.any { output ->
                def path = output.toPath().toAbsolutePath().normalize()
                roots.any { path.startsWith(it) }
            }
            // Do not add a producer which would schedule a selected compiler
            // or the model extraction task again through its own prerequisite.
            return producesJavaSources && closure([task]).disjoint(blocked)
        }
    }
    def nativeKaptGeneration = { compile, sourceFiles, javaFiles, classpath, freeArgs, diagnostic ->
        // Preserve evaluation order and retain only typed progress if authority is unavailable.
        def check = { name, test ->
            diagnostic.check = name
            def passed = test()
            diagnostic.outcome = passed ? "PASSED" : "FAILED"
            return passed
        }
        try {
            if (!check("KAPT_PLUGIN", { project.pluginManager.hasPlugin("org.jetbrains.kotlin.kapt") })) return null
            diagnostic.check = "KAPT_TASK_PROVIDER"
            def kapt = project.tasks.findByName("kaptKotlin")
            diagnostic.check = "STUBS_TASK_PROVIDER"
            def stubs = project.tasks.findByName("kaptGenerateStubsKotlin")
            if (!check("KAPT_TASK_TYPE", { kapt?.class?.superclass?.name == "org.jetbrains.kotlin.gradle.internal.KaptWithoutKotlincTask" }) ||
                !check("STUBS_TASK_TYPE", { stubs?.class?.superclass?.name == "org.jetbrains.kotlin.gradle.internal.KaptGenerateStubsTask" })) return null
            diagnostic.check = "KGP_ROW"
            def kgp = kapt.class.superclass.package.implementationVersion
            if (!check("KGP_ROW", { diagnostic.kgp = kgp == "2.2.21-release-469" })) return null
            if (springCompile == null) {
                if (!check("COMPILE_NOT_IN_GRAPH", { !gradle.taskGraph.hasTask(compile) })) return null
            } else if (!check("SPRING_COMPILE_OUTCOME", {
                gradle.taskGraph.hasTask(compile) && compile.state.executed && compile.state.didWork &&
                    compile.state.failure == null && !compile.state.skipped && capturedInputs != null
            })) return null
            if (!check("COMPILE_DEPENDS_ON_KAPT", { compile.taskDependencies.getDependencies(compile).contains(kapt) }) ||
                !check("KAPT_DEPENDS_ON_STUBS", { kapt.taskDependencies.getDependencies(kapt).contains(stubs) })) return null
            def completed = { task ->
                def state = task.state
                gradle.taskGraph.hasTask(task) && state.executed && state.failure == null && !state.noSource &&
                    (state.didWork || state.upToDate || state.skipMessage == "FROM-CACHE")
            }
            if (!check("STUBS_TASK_OUTCOME", { completed(stubs) }) ||
                !check("KAPT_TASK_OUTCOME", { completed(kapt) })) return null
            if (!check("NORMAL_PLUGIN_OPTIONS", {
                    diagnostic.pluginOptionsEmpty = !compile.pluginOptions.get().any { !it.allOptions().isEmpty() }
                    diagnostic.pluginOptionsEmpty || springCompile != null && springCompile == springPlan(compile)
                }) ||
                !check("FORBIDDEN_FREE_ARGS", {
                    !freeArgs.any { arg ->
                        def classifier = arg.startsWith("-Xplugin") ? "XPLUGIN" :
                            arg == "-P" ? "P_OPTION" : arg.startsWith("plugin:") ? "PLUGIN_PREFIX" : null
                        if (classifier != null) diagnostic.freeArgClassifier = classifier
                        classifier != null
                    }
                })) return null
            diagnostic.check = "OUTPUT_ROOTS"
            def javaRoot = kapt.destinationDir.get().asFile.canonicalFile
            def kotlinRoot = kapt.kotlinSourcesDestinationDir.get().asFile.canonicalFile
            def classes = kapt.classesDir.get().asFile.canonicalFile
            def repo = project.rootDir.canonicalFile.toPath()
            if (!check("OUTPUT_ROOTS", { [javaRoot, kotlinRoot, classes].every { it.toPath().startsWith(repo) } })) return null
            diagnostic.check = "GENERATED_JAVA_PRESENT"
            def java = project.fileTree(javaRoot).matching { include "**/*.java" }.files
            def kotlin = project.fileTree(kotlinRoot).matching { include "**/*.kt", "**/*.kts" }.files
            def selected = { files -> files.collect { new File(it).canonicalFile } as Set }
            if (!check("GENERATED_JAVA_PRESENT", { diagnostic.generatedJavaPresent = !java.isEmpty() }) ||
                !check("GENERATED_JAVA_SELECTED", { diagnostic.generatedJavaSelected = selected(javaFiles).containsAll(java) }) ||
                !check("GENERATED_KOTLIN_SELECTED", { diagnostic.generatedKotlinSelected = selected(sourceFiles).containsAll(kotlin) }) ||
                !check("GENERATED_CLASSES_SELECTED", { diagnostic.generatedClassesSelected = selected(classpath).contains(classes) })) return null
            def generation = [
                tasks: [stubs.path, kapt.path],
                kotlinGradlePlugin: kgp,
                normalCompilerPluginOptions: springCompile?.options ?: [],
                generatedJavaRoot: repo.relativize(javaRoot.toPath()).toString(),
                generatedKotlinRoot: repo.relativize(kotlinRoot.toPath()).toString(),
                generatedClasses: repo.relativize(classes.toPath()).toString()
            ]
            if (springCompile != null) {
                def destination = compile.destinationDirectory.get().asFile.canonicalFile.toPath()
                if (!check("SPRING_COMPILE_INPUTS", { capturedInputs == springInputs(compile) })) return null
                if (!check("SPRING_COMPILE_OUTPUTS", { destination.startsWith(repo) && destination.toFile().isDirectory() })) return null
                generation.springCompilation = springCompile + [
                    sourceDigests: capturedInputs.sources,
                    generatedJavaDigests: capturedInputs.sources.java.findAll { path, hash ->
                        path.startsWith(generation.generatedJavaRoot + "/")
                    },
                    classpathDigests: capturedInputs.classpath,
                    outputRoot: repo.relativize(destination).toString(),
                    classDigests: project.fileTree(destination.toFile()).matching { include "**/*.class" }.files.collectEntries { file ->
                        [destination.relativize(file.toPath()).toString().replace('\\', '/'), digestFile(file)]
                    }.sort(),
                    outcome: "EXECUTED",
                ]
            }
            return generation
        } catch (Exception ignored) {
            diagnostic.outcome = "UNAVAILABLE"
            return null
        }
    }
    project.tasks.register("semanticThreadModel") { modelTask ->
        // Gradle can report repository-local project artifacts in a compilation
        // classpath before those artifacts exist in a pristine checkout. Run
        // the selected compilation's declared prerequisites, including source
        // generators attached with compile.dependsOn. Classpath dependencies
        // alone do not describe the effective source inputs. Only the qualified
        // Spring capture needs the selected native compiler result.
        dependsOn {
            def compile = project.tasks.findByName(requestedCompileTask)
            if (compile == null) return []
            def provider = selectedClasspathProvider(compile)
            def prerequisites = new LinkedHashSet(compile.taskDependencies.getDependencies(compile))
            if (provider != null) prerequisites.addAll(provider.buildDependencies.getDependencies(compile))
            prerequisites.addAll(selectedJavaSourceProducers(compile, modelTask))
            if (springCompile != null) prerequisites.add(compile)
            return prerequisites.findAll { springCompile != null || it.path != compile.path }
        }
        doLast {
            def requested = requestedCompileTask
            def compile = project.tasks.findByName(requested)
            if (compile == null) {
                throw new GradleException("Kotlin compilation task not found: ${project.path}:${requested}")
            }
            def filesOf = { String property ->
                try {
                    def value = compile.property(property)
                    return [available: true, values: value == null ? [] : value.files.collect { it.absolutePath }]
                } catch (Throwable ignored) {
                    return [available: false, values: []]
                }
            }
            def option = { String property ->
                try {
                    def value = compile.compilerOptions."${property}"
                    if (value == null) return [available: true, value: null]
                    def rendered = value.metaClass.respondsTo(value, "getOrNull") ? value.getOrNull()?.toString() : value.toString()
                    if (property in ["languageVersion", "apiVersion"] && rendered ==~ /KOTLIN_[0-9]+_[0-9]+/) {
                        rendered = rendered.substring("KOTLIN_".length()).replace('_', '.')
                    }
                    return [available: true, value: rendered]
                } catch (Throwable ignored) {
                    return [available: false, value: null]
                }
            }
            def listOption = { String property ->
                try {
                    def value = compile.compilerOptions."${property}"
                    if (value == null) return [available: true, values: []]
                    def resolved = value.metaClass.respondsTo(value, "getOrElse") ? value.getOrElse([]) : value
                    return [available: true, values: resolved.collect { it.toString() }]
                } catch (Throwable ignored) {
                    return [available: false, values: []]
                }
            }
            def sourceFiles = []
            def sourceFilesAvailable = true
            try { sourceFiles = compile.sources.files.collect { it.absolutePath }.sort() } catch (Throwable ignored) { sourceFilesAvailable = false }
            // KotlinCompile resolves Java declarations from a separate selected
            // input collection. These are analysis inputs, not Kotlin index files.
            def javaSources = filesOf("javaSources")
            if (!javaSources.available) throw new GradleException("Selected Kotlin compilation Java source inputs are unavailable")
            // Kotlin's task-level `libraries` is the first-choice compilation
            // authority when the plugin exposes it. The named resolvable
            // configuration is the explicit fallback across other plugin lines.
            def sourceSetName = sourceSetNameOf(compile)
            def configurationName = sourceSetName == "main" ? "compileClasspath" : sourceSetName + "CompileClasspath"
            def sourceSetClasspath = []
            def sourceSetClasspathAvailable = false
            try {
                def configuration = project.configurations.findByName(configurationName)
                if (configuration != null) {
                    sourceSetClasspath = configuration.files.collect { it.absolutePath }
                    sourceSetClasspathAvailable = true
                }
            } catch (Throwable ignored) {}
            def libraries = filesOf("libraries")
            def friendPaths = filesOf("friendPaths")
            def pluginClasspath = filesOf("pluginClasspath")
            def freeCompilerArgs = listOption("freeCompilerArgs")
            def optIns = listOption("optIn")
            def languageVersion = option("languageVersion")
            def apiVersion = option("apiVersion")
            def jvmTarget = option("jvmTarget")
            // Preserve exactly one provider order. Classpath order participates
            // in symbol resolution; combining providers can add artifacts that
            // the Kotlin compilation itself never sees.
            def taskLibrariesUsable = libraries.available && !libraries.values.isEmpty()
            def configurationUsable = sourceSetClasspathAvailable && !sourceSetClasspath.isEmpty()
            def classpath = taskLibrariesUsable ? libraries.values :
                (configurationUsable ? sourceSetClasspath : [])
            def classpathAuthority = taskLibrariesUsable ? "KOTLIN_TASK_LIBRARIES" :
                (configurationUsable ? "GRADLE_RESOLVABLE_CONFIGURATION" : "UNAVAILABLE")
            def orderedDigest = { List<String> values ->
                def digest = MessageDigest.getInstance("SHA-256")
                values.each { value -> digest.update(value.getBytes("UTF-8")); digest.update((byte) 0) }
                return "sha256:" + digest.digest().collect { String.format("%02x", it & 0xff) }.join("")
            }
            def classpathAuthoritiesDiffer = taskLibrariesUsable && configurationUsable &&
                libraries.values != sourceSetClasspath
            def compilerVersion = null
            def compilerVersionSource = "UNAVAILABLE"
            try {
                def providerGetter = compile.class.methods.find { method ->
                    method.parameterCount == 0 &&
                        (method.name == "getKotlinCompilerVersion" || method.name.startsWith("getKotlinCompilerVersion\$"))
                }
                def provider = providerGetter?.invoke(compile)
                def value = provider?.metaClass?.respondsTo(provider, "getOrNull") ? provider.getOrNull() :
                    (provider?.metaClass?.respondsTo(provider, "get") ? provider.get() : provider)
                compilerVersion = value?.toString()?.trim()
                if (compilerVersion) compilerVersionSource = "KGP_COMPILER_VERSION_PROVIDER"
            } catch (Throwable ignored) {}
            if (!compilerVersion) {
                try {
                    def versionClass = compile.class.classLoader.loadClass("org.jetbrains.kotlin.config.KotlinCompilerVersion")
                    compilerVersion = versionClass.getField("VERSION").get(null)?.toString()?.trim()
                    if (compilerVersion) compilerVersionSource = "KOTLIN_COMPILER_VERSION_CLASSLOADER_FALLBACK"
                } catch (Throwable ignored) {}
            }
            def compilerVersionAvailable = compilerVersion != null && !compilerVersion.isEmpty()
            def dependencyCoordinates = []
            def dependencyArtifacts = []
            def dependencyCoordinatesAvailable = true
            try {
                def configuration = project.configurations.findByName(configurationName)
                def byFile = [:]
                def variantsByFile = [:]
                configuration?.incoming?.artifacts?.artifacts?.each { resolved ->
                    def attributes = [:]
                    resolved.variant.attributes.keySet().sort { it.name }.each { key ->
                        attributes[key.name] = resolved.variant.attributes.getAttribute(key)?.toString()
                    }
                    variantsByFile[resolved.file.absolutePath] = attributes
                }
                configuration?.resolvedConfiguration?.resolvedArtifacts?.each { artifact ->
                    def id = artifact.moduleVersion.id
                    byFile[artifact.file.absolutePath] = [
                        group: id.group, name: artifact.name, version: id.version,
                        classifier: artifact.hasProperty("classifier") ? artifact.classifier : null,
                        extension: artifact.hasProperty("extension") ? artifact.extension :
                            (artifact.file.name.contains('.') ? artifact.file.name.substring(artifact.file.name.lastIndexOf('.') + 1) : ""),
                        scope: configurationName
                    ]
                }
                classpath.eachWithIndex { path, index ->
                    if (byFile.containsKey(path)) {
                        dependencyCoordinates.add(byFile[path])
                        // Project class directories retain their ordered compiler input
                        // and tree identity. Only files have portable artifact records.
                        if (!new File(path).isDirectory()) {
                            dependencyArtifacts.add([
                                classpathIndex: index, file: path, coordinates: byFile[path],
                                variant: variantsByFile[path] ?: [:]
                            ])
                        }
                    }
                }
            } catch (Throwable ignored) { dependencyCoordinatesAvailable = false }
            def publicationDeclarations = []
            try {
                project.extensions.findByName("publishing")?.publications?.each { publication ->
                    if (publication.hasProperty("groupId") && publication.hasProperty("artifactId")) {
                        publicationDeclarations.add([
                            group: publication.groupId, name: publication.artifactId,
                            version: publication.version, authority: "GRADLE_PUBLICATION_DECLARATION"
                        ])
                    }
                }
            } catch (Throwable ignored) {}
            if (publicationDeclarations.isEmpty()) publicationDeclarations.add([
                group: project.group.toString(), name: project.name, version: project.version.toString(),
                authority: "GRADLE_PROJECT_DECLARATION"
            ])
            def repositories = []
            def repositoriesAvailable = true
            try {
                project.repositories.each { repository ->
                    def url = null
                    try { url = repository.hasProperty("url") ? repository.url?.toString() : null } catch (Throwable ignored) {}
                    repositories.add([name: repository.name, url: url])
                }
            } catch (Throwable ignored) { repositoriesAvailable = false }
            def generatedRoots = (sourceFiles + javaSources.values).findAll { path ->
                path.replace('\\', '/').contains('/build/generated/')
            }.collect { new File(it).parentFile.absolutePath }.unique().sort()
            def jdkHome = System.getProperty("java.home")
            def jdkHomeAvailable = false
            def jdkHomeAuthority = "BOUNDARY_BUILD_JVM_FALLBACK"
            // KotlinCompile uses UsesKotlinJavaToolchain, not JavaCompile's
            // javaLauncher. Read its effective executable, including task-local
            // overrides, without replacing the analyzer JVM or project target.
            def toolchain = compile.hasProperty("kotlinJavaToolchainProvider") ?
                compile.property("kotlinJavaToolchainProvider").get() : null
            def executableGetters = toolchain == null ? [] : toolchain.class.methods.findAll {
                it.parameterCount == 0 &&
                    (it.name == "getJavaExecutable" || it.name.startsWith('getJavaExecutable$'))
            }
            if (!executableGetters.isEmpty()) {
                if (executableGetters.size() != 1) throw new GradleException("Kotlin compile toolchain executable is ambiguous")
                // Resolution failure must not silently substitute the build JVM.
                def executable = executableGetters[0].invoke(toolchain).get().asFile.canonicalFile
                def home = executable.parentFile.parentFile
                if (home.name == "jre" && new File(home.parentFile, "release").isFile()) home = home.parentFile
                def hasImage = ["lib/modules", "jre/lib/rt.jar", "lib/rt.jar"].any { new File(home, it).isFile() }
                if (!new File(home, "release").isFile() || !hasImage) {
                    throw new GradleException("Kotlin compile toolchain has no complete JDK image")
                }
                jdkHome = home.absolutePath
                jdkHomeAvailable = true
                jdkHomeAuthority = "AVAILABLE_KOTLIN_COMPILE_TOOLCHAIN"
            }
            if (!jdkHomeAvailable) try {
                def launcherProvider = compile.hasProperty("javaLauncher") ? compile.property("javaLauncher") : null
                def launcher = launcherProvider?.metaClass?.respondsTo(launcherProvider, "getOrNull") ? launcherProvider.getOrNull() : launcherProvider
                def installation = launcher?.metadata?.installationPath?.asFile
                if (installation != null) {
                    jdkHome = installation.absolutePath
                    jdkHomeAvailable = true
                    jdkHomeAuthority = "AVAILABLE_COMPILE_TOOLCHAIN"
                }
            } catch (Throwable ignored) {}
            def buildModelBoundaries = []
            if (!sourceFilesAvailable) buildModelBoundaries.add("GRADLE_SOURCE_FILES_UNAVAILABLE_REFLECTION")
            if (!sourceSetClasspathAvailable) buildModelBoundaries.add("GRADLE_SOURCE_SET_CLASSPATH_UNAVAILABLE_REFLECTION")
            if (classpathAuthoritiesDiffer) buildModelBoundaries.add("GRADLE_CLASSPATH_AUTHORITIES_DIFFER")
            if (!compilerVersionAvailable) buildModelBoundaries.add("GRADLE_COMPILER_VERSION_UNAVAILABLE_REFLECTION")
            if (!dependencyCoordinatesAvailable) buildModelBoundaries.add("GRADLE_DEPENDENCY_COORDINATES_UNAVAILABLE")
            if (!repositoriesAvailable) buildModelBoundaries.add("GRADLE_REPOSITORIES_UNAVAILABLE")
            if (!jdkHomeAvailable) buildModelBoundaries.add("GRADLE_COMPILE_TOOLCHAIN_UNAVAILABLE_USING_BUILD_JVM")
            buildModelBoundaries.add("GRADLE_BUILDSCRIPT_PLUGIN_COORDINATES_UNAVAILABLE")
            if (!generatedRoots.isEmpty()) buildModelBoundaries.add("GRADLE_GENERATED_SOURCE_PRODUCERS_UNAVAILABLE")
            def tasks = project.tasks.collect { it.name }.sort()
            def model = [
                projectPath: project.path,
                projectDir: project.projectDir.absolutePath,
                platform: "JVM",
                compileTask: compile.path,
                sourceFiles: sourceFiles,
                javaSourceFiles: javaSources.values.unique().sort(),
                classpath: classpath,
                classpathAuthority: [
                    chosen: classpathAuthority,
                    taskLibrariesDigest: taskLibrariesUsable ? orderedDigest(libraries.values) : null,
                    configurationDigest: configurationUsable ? orderedDigest(sourceSetClasspath) : null,
                    orderedEquivalent: taskLibrariesUsable && configurationUsable ? !classpathAuthoritiesDiffer : null
                ],
                friendPaths: friendPaths.values,
                compilerPlugins: pluginClasspath.values,
                compilerVersion: compilerVersion,
                projectCompilerAuthority: [
                    source: compilerVersionSource,
                    status: compilerVersionAvailable ? "AVAILABLE" : "UNAVAILABLE"
                ],
                languageVersion: languageVersion.value,
                apiVersion: apiVersion.value,
                jvmTarget: jvmTarget.value,
                freeCompilerArguments: freeCompilerArgs.values,
                optIns: optIns.values,
                dependencyCoordinates: dependencyCoordinates,
                dependencyArtifacts: dependencyArtifacts,
                publicationDeclarations: publicationDeclarations,
                repositories: repositories,
                reactorPoms: [],
                buildPlugins: [],
                generatedSourceConfiguration: [
                    roots: generatedRoots,
                    producers: [],
                    status: generatedRoots.isEmpty() ? "NONE_DISCOVERED" : "ROOTS_WITH_PRODUCER_BOUNDARY"
                ],
                buildModelBoundaries: buildModelBoundaries.sort(),
                fieldBoundaries: [
                    libraries: taskLibrariesUsable ? "AVAILABLE_ORDERED_KOTLIN_TASK" :
                        (configurationUsable ? "AVAILABLE_ORDERED_CONFIGURATION_FALLBACK" : "UNAVAILABLE"),
                    friendPaths: friendPaths.available ? "AVAILABLE" : "UNAVAILABLE_REFLECTION",
                    compilerPlugins: pluginClasspath.available ? "AVAILABLE" : "UNAVAILABLE_REFLECTION",
                    freeCompilerArguments: freeCompilerArgs.available ? "AVAILABLE" : "UNAVAILABLE_REFLECTION",
                    optIns: optIns.available ? "AVAILABLE" : "UNAVAILABLE_REFLECTION",
                    languageVersion: languageVersion.available ? "AVAILABLE" : "UNAVAILABLE_REFLECTION",
                    apiVersion: apiVersion.available ? "AVAILABLE" : "UNAVAILABLE_REFLECTION",
                    jvmTarget: jvmTarget.available ? "AVAILABLE" : "UNAVAILABLE_REFLECTION",
                    compilerVersion: compilerVersionAvailable ? "AVAILABLE_${compilerVersionSource}" : "UNAVAILABLE",
                    jdkHome: jdkHomeAuthority
                ],
                tasks: tasks,
                gradleVersion: gradle.gradleVersion,
                jdkHome: jdkHome
            ]
            def nativeDiagnostic = [:]
            def firstGate = [
                ["GRADLE_ROW", { gradle.gradleVersion == "8.14.1" }, "FAILED"],
                ["COMPILER_ROW", { compilerVersion == "2.2.21" }, "FAILED"],
                ["MAIN_COMPILE_TASK", { nativeDiagnostic.mainCompileTask = compile.name == "compileKotlin" }, "FAILED"],
                ["JVM_TARGET", { jvmTarget.value == "JVM_21" }, jvmTarget.available ? "FAILED" : "UNAVAILABLE"],
                ["JDK_PROVIDER", { jdkHomeAvailable }, "UNAVAILABLE"],
                ["ARTIFACT_PROVIDER", { pluginClasspath.available }, "UNAVAILABLE"],
                ["FREE_ARGS_PROVIDER", { freeCompilerArgs.available }, "UNAVAILABLE"],
            ].find { !it[1]() }
            if (firstGate == null) {
                def kapt = nativeKaptGeneration(compile, sourceFiles, javaSources.values, classpath, freeCompilerArgs.values, nativeDiagnostic)
                if (kapt != null) model.nativeKaptGeneration = kapt
            } else {
                nativeDiagnostic.check = firstGate[0]
                nativeDiagnostic.outcome = firstGate[2]
            }
            nativeDiagnostic.gradleJvmMajor = JavaVersion.current().majorVersion.toInteger()
            model.nativeKaptDiagnostic = nativeDiagnostic
            println("__SEMANTIC_THREAD_MODEL__" + JsonOutput.toJson(model))
        }
    }
}
