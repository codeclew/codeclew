name: macOS release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify runner architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Build sealed release bundle
        env:
          CODECLEW_VERSION: ${{ github.ref_name }}
        run: >-
          python3 -I -S scripts/build_macos_release.py
          --version "$CODECLEW_VERSION"
          --output "$RUNNER_TEMP/codeclew-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: codeclew-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/codeclew-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          sha256sum --check codeclew-macos-arm64.tar.gz.sha256
          sha256sum --check codeclew-macos-x86_64.tar.gz.sha256
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            'Public macOS pilot for Apple Silicon and Intel.' \
            '' \
            'Install:' \
            '```sh' \
            'curl -fsSL https://codeclew.github.io/codeclew/install.sh | sh' \
            '```' \
            '' \
            'The installer verifies the published SHA-256 checksum and never compiles Codeclew locally.' \
            >"$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release-assets/* \
              --verify-tag \
              --title "Codeclew $GITHUB_REF_NAME — macOS pilot" \
              --notes-file "$notes"
          fi
