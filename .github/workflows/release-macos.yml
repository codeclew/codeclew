name: macOS and Linux release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (existing tag for publication, unused version for build only)
        required: true
        type: string
      build_only:
        description: Qualify and build this workflow commit without creating a public tag or release
        type: boolean
        default: false
      expected_existing_tag_commit:
        description: Expected current tag target for a corrected runner-local candidate; never changes origin
        type: string
        default: ''
      qualify_large_java:
        description: Run the large Java gate on a build-only candidate before an authorized tag correction
        type: boolean
        default: false

env:
  # Match the development CI profile for native qualification tests; release builds keep their own profile.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only && github.sha || (github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name) }}

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify conditional mutation pilot
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Retain JDK 25 for project-toolchain qualification
        run: echo "CODECLEW_TEST_JDK25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Qualify Kotlin JVM 25 project semantics on the packaged analyzer
        run: ./gradlew --no-daemon :workers:kotlin:test --tests dev.semanticthread.worker.KotlinEngineCompatibilityTest --tests dev.semanticthread.worker.KotlinJvm25QualificationTest
      - name: Qualify Rust and Python conditional mutation
        run: |
          # Keep bootstrap diagnostics visible before the pilot captures command output.
          export CODECLEW_HOME="$HOME/.codeclew-release-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ./clew --version
          python3 -I -S scripts/language_mutation_pilot.py --reuse-primed-runtime
          python3 -I -S scripts/qualification/kotlin-native-classpath.py \
            --output "$RUNNER_TEMP/kotlin-native-classpath"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-native-classpath-qualification
          path: |
            ${{ runner.temp }}/kotlin-native-classpath/result.json
            ${{ runner.temp }}/kotlin-native-classpath/*/check.json
            ${{ runner.temp }}/kotlin-native-classpath/*/check.stderr
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            dotnet_arch: arm64
            os: macos
            kernel: Darwin
            runner: macos-15
          - arch: x86_64
            dotnet_arch: x64
            os: macos
            kernel: Darwin
            runner: macos-15-intel
          - arch: x86_64
            dotnet_arch: x64
            os: linux
            kernel: Linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - name: Bind an unpublished candidate version to this exact commit
        if: github.event_name == 'workflow_dispatch' && inputs.build_only
        env:
          EXPECTED_EXISTING_TAG_COMMIT: ${{ inputs.expected_existing_tag_commit }}
        run: |
          args=(--version "$RELEASE_VERSION" --commit "$GITHUB_SHA")
          if [ -n "$EXPECTED_EXISTING_TAG_COMMIT" ]; then
            args+=(--expected-existing-tag-commit "$EXPECTED_EXISTING_TAG_COMMIT")
          fi
          python3 -I -S scripts/prepare_release_candidate.py "${args[@]}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the required C# preview SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          architecture: ${{ matrix.dotnet_arch }}
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify runner platform
        run: |
          test "$(uname -s)" = '${{ matrix.kernel }}'
          test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Qualify the real C# Roslyn worker on this release architecture
        run: ./scripts/ci-verify.sh --csharp-only
      - name: Build sealed release bundle
        env:
          CODECLEW_VERSION: ${{ env.RELEASE_VERSION }}
        run: >-
          python3 -I -S scripts/build_macos_release.py
          --version "$CODECLEW_VERSION"
          --output "$RUNNER_TEMP/codeclew-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: codeclew-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/codeclew-assets/*
          if-no-files-found: error
          retention-days: 7

  java-large:
    name: Qualify final official Linux large Java producer
    needs: build
    if: github.event_name != 'workflow_dispatch' || !inputs.build_only || inputs.qualify_large_java
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: codeclew-linux-x86_64
          path: ${{ runner.temp }}/codeclew-assets
      - name: Verify exact official archive checksum
        working-directory: ${{ runner.temp }}/codeclew-assets
        run: sha256sum --check codeclew-linux-x86_64.tar.gz.sha256
      - name: Qualify one real large Java producer on the final official Linux package
        env:
          LARGE_FIXTURE: ${{ runner.temp }}/java-large-producer
        run: |
          # One predeclared runner envelope, with no automatic retry or escalation.
          # Build-only packages use small independent semantic/SOURCE acceptance.
          mkdir -p "$LARGE_FIXTURE"
          free -b > "$LARGE_FIXTURE/runner-before-swap.txt"
          df -B1 "$RUNNER_TEMP" >> "$LARGE_FIXTURE/runner-before-swap.txt"
          # Guard the full resource envelope BEFORE allocating swap or extracting.
          python3 -I -S - <<'PYTHON'
          import json, os, shutil, tarfile
          from pathlib import Path
          root=Path(os.environ["LARGE_FIXTURE"])
          archive=Path(os.environ["RUNNER_TEMP"])/"codeclew-assets/codeclew-linux-x86_64.tar.gz"
          values={k:int(v.split()[0])*1024 for k,v in (line.split(":",1) for line in Path("/proc/meminfo").read_text().splitlines())}
          with tarfile.open(archive) as bundle:
              extraction=sum(member.size for member in bundle.getmembers())+1024**3
          required=8*1024**3+8*1024**3+extraction
          report={"freeDiskBytes":shutil.disk_usage(root).free,"requiredDiskBytesBeforeAllocation":required,
                  "swapAllocationBytes":8*1024**3,"remainingLaunchReserveBytes":8*1024**3,
                  "extractionAllowanceBytes":extraction,"memoryTotalBytes":values["MemTotal"],
                  "minimumMemoryBytes":12*1024**3,"retryOrEscalationAllowed":False}
          report["status"]="PASS" if report["freeDiskBytes"]>=required and values["MemTotal"]>=report["minimumMemoryBytes"] else "REFUSED"
          (root/"resource-preflight.json").write_text(json.dumps(report,indent=2)+"\n")
          if report["status"]!="PASS":raise SystemExit("Runner lacks predeclared space/RAM; no swap allocation or capture started")
          PYTHON
          sudo swapoff -a
          sudo fallocate -l 8G "$RUNNER_TEMP/clew-java-swap"
          sudo chmod 0600 "$RUNNER_TEMP/clew-java-swap"
          sudo mkswap "$RUNNER_TEMP/clew-java-swap"
          sudo swapon "$RUNNER_TEMP/clew-java-swap"
          free -b > "$LARGE_FIXTURE/runner-after-swap.txt"
          export LARGE_FIXTURE
          python3 -I -S - <<'PYTHON'
          import os, runpy
          from pathlib import Path
          archive=Path(os.environ["RUNNER_TEMP"])/"codeclew-assets/codeclew-linux-x86_64.tar.gz"
          package=runpy.run_path("scripts/build_macos_release.py")["extract_release_archive"](
              archive,Path(os.environ["RUNNER_TEMP"])/"java-large-official-package")
          Path(os.environ["LARGE_FIXTURE"],"launcher.txt").write_text(str(package/"bin/clew")+"\n")
          PYTHON
          python3 -I -S scripts/qualify_large_java_capture.py \
            --output "$LARGE_FIXTURE/fixture" --methods 1665 --steps 100 --scopes 3 \
            --clew "$(cat "$LARGE_FIXTURE/launcher.txt")" \
            --archive "$RUNNER_TEMP/codeclew-assets/codeclew-linux-x86_64.tar.gz" \
            --expected-commit "$(git rev-parse HEAD)" --require-old-threshold \
            > "$LARGE_FIXTURE/qualification.stdout" 2> "$LARGE_FIXTURE/qualification.stderr"
      - name: Retain large producer primary evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-large-producer-evidence
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/java-large-producer/*.txt
            ${{ runner.temp }}/java-large-producer/*.json
            ${{ runner.temp }}/java-large-producer/qualification.*
            ${{ runner.temp }}/java-large-producer/fixture/*.json
            ${{ runner.temp }}/java-large-producer/fixture/repository/**
            ${{ runner.temp }}/java-large-producer/fixture/capture/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Stage verified GitHub draft release
    needs: [build, java-large]
    if: github.event_name != 'workflow_dispatch' || !inputs.build_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-assets
          pattern: codeclew-*
          merge-multiple: true
      - name: Stage offline installer
        run: |
          install -m 0755 site/install.sh "$RUNNER_TEMP/release-assets/install.sh"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum install.sh >install.sh.sha256
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          sha256sum --check install.sh.sha256
          sha256sum --check codeclew-macos-arm64.tar.gz.sha256
          sha256sum --check codeclew-macos-x86_64.tar.gz.sha256
          sha256sum --check codeclew-linux-x86_64.tar.gz.sha256
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          for attempt in $(seq 1 120); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&per_page=10" --jq '.workflow_runs | sort_by(.created_at) | last | if . == null or .status != "completed" then "pending" else .conclusion end')
            case "$result" in
              success) exit 0 ;;
              pending) sleep 30 ;;
              *) printf 'Release CI did not pass: %s\n' "$result" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' 'Timed out waiting for release-commit CI' >&2
          exit 1
      - name: Stage immutable assets for independent acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            'Public pilot for macOS Apple Silicon/Intel and Linux x86_64, including Windows through WSL2.' \
            '' \
            'Install:' \
            '```sh' \
            'curl -fsSL https://codeclew.github.io/codeclew/install.sh | sh' \
            '```' \
            '' \
            'On Windows, run this command inside WSL2. Linux requires glibc 2.35+ and Python 3.11+. Keep installation, state, and repositories in the Linux filesystem.' \
            'The installer verifies the published SHA-256 checksum and never compiles Codeclew locally.' \
            'For an offline install, download install.sh, install.sh.sha256, the archive for your architecture, and its matching .sha256 file from this release. Set CODECLEW_VERSION to this tag and CODECLEW_ASSET_DIR to their local directory.' \
            'The default profile contains Kotlin 2.4.10 plus operationally pilot-ready conditional Rust and Python mutation. Rust/Python evidence remains PARTIAL/UNSURE and requires native validation plus explicit obligation acknowledgement.' \
            >"$notes"
          if [ -f "docs/releases/$RELEASE_VERSION.md" ]; then
            cp "docs/releases/$RELEASE_VERSION.md" "$notes"
          fi
          # Never race independent package acceptance with public publication.
          # After acceptance, promote this same draft via gh release edit --draft=false.
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_VERSION" "$RUNNER_TEMP"/release-assets/* --clobber
          else
            gh release create "$RELEASE_VERSION" "$RUNNER_TEMP"/release-assets/* \
              --verify-tag --draft \
              --title "Codeclew $RELEASE_VERSION — macOS and Linux pilot" \
              --notes-file "$notes"
          fi
