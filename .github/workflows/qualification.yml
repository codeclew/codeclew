name: pilot-qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

jobs:
  kotlin24-pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: dtolnay/rust-toolchain@1.92.0
        with: { components: 'rustfmt,clippy' }
      - uses: Swatinem/rust-cache@v2
      - run: chmod +x clew gradlew fixtures/kotlin-basic/gradlew scripts/qualification/pilot-readiness.sh
      - run: ./scripts/qualification/pilot-readiness.sh
