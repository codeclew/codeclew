name: pilot-qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

jobs:
  kotlin-engine-compatibility:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: chmod +x gradlew fixtures/kotlin-basic/gradlew scripts/kotlin-compatibility-gate.py
      - name: Qualify Kotlin project semantics against K24
        shell: bash
        run: |
          set -euo pipefail
          for row in \
            k24-exact \
            k24-language-23 \
            k24-from-240 \
            k24-from-230 \
            k24-from-2121 \
            k24-from-2121-serialization \
            allopen-negative \
            k19-negative
          do
            ./scripts/kotlin-compatibility-gate.py \
              --row "$row" \
              --full-lifecycle
          done

  kotlin24-pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: dtolnay/rust-toolchain@1.92.0
        with: { components: 'rustfmt,clippy' }
      - uses: Swatinem/rust-cache@v2
      - run: chmod +x clew gradlew fixtures/kotlin-basic/gradlew scripts/qualification/pilot-readiness.sh
      - run: ./scripts/qualification/pilot-readiness.sh
