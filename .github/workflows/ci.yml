name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GitHub's synthetic pull-request merge commit contains the actor's
          # identity. Scan the submitted head and its real history instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python3 scripts/check_repository_privacy.py --self-test
      - run: python3 scripts/check_repository_privacy.py --history
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install the required C# preview SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          architecture: x64
      - uses: dtolnay/rust-toolchain@1.92.0
        with: { components: 'rustfmt,clippy' }
      - uses: Swatinem/rust-cache@v2
      - run: chmod +x gradlew fixtures/kotlin-basic/gradlew scripts/*.sh
      - run: ./scripts/ci-verify.sh

  documentation-recovery-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Test grouped operation author on its supported isolated host
        run: "cargo test --locked -p clew --lib 'documentation::agent_jobs::operation_draft::context_mode::tests::' -- --test-threads=1"
      - name: Test grouped independent review and recovery on its supported isolated host
        run: "cargo test --locked -p clew --lib 'documentation::agent_jobs::operation_draft_review::context_mode::tests::' -- --test-threads=1"
      - run: cargo test --locked -p clew --test documentation_system docsys_t04_ -- --test-threads=1
      - run: 'cargo test --locked -p clew --test documentation_system _recovery:: -- --test-threads=1'
