name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ci-plan:
    runs-on: ubuntu-latest
    outputs:
      reuse_full_ci: ${{ steps.reuse.outputs.reuse_full_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Find full CI for an unchanged promoted commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          CLEW_CI_REPOSITORY_ID: ${{ github.repository_id }}
        run: python3 -I -S scripts/ci_reuse.py

  verify-linux:
    needs: ci-plan
    if: needs.ci-plan.outputs.reuse_full_ci != 'true'
    name: Linux (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [checks, retained-docs, native-pages, managed-docs, java, kotlin, usability]
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the submitted head and its content history rather than the
          # synthetic pull-request merge tree. Git author identity is unrestricted.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python3 scripts/check_repository_privacy.py --self-test
      - run: python3 scripts/check_repository_privacy.py --history
      - uses: actions/setup-java@v4
        if: matrix.suite == 'kotlin'
        with: { distribution: temurin, java-version: '25' }
      - name: Retain JDK 25 for project-toolchain qualification
        if: matrix.suite == 'kotlin'
        run: echo "CODECLEW_TEST_JDK25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        if: matrix.suite == 'checks'
        with: { node-version: '22' }
      - name: Install the required C# preview SDK
        if: matrix.suite == 'checks'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
          architecture: x64
      - uses: dtolnay/rust-toolchain@1.92.0
        with: { components: 'rustfmt,clippy' }
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.suite }}
      - run: chmod +x gradlew fixtures/kotlin-basic/gradlew scripts/*.sh
      - run: ./scripts/ci-verify.sh --suite '${{ matrix.suite }}'

  documentation-recovery-macos:
    needs: ci-plan
    if: needs.ci-plan.outputs.reuse_full_ci != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Test retained process call bindings and graph traversal
        run: |
          cargo test --locked -p clew --lib 'documentation::process_call_bindings::tests::' -- --test-threads=1
          cargo test --locked -p clew --lib 'documentation::process_graph::tests::' -- --test-threads=1
          cargo test --locked -p clew --lib 'documentation::kotlin::tests::exact_call_argument_binding_envelope_preserves_source_order_and_optional_names' -- --test-threads=1
      - name: Test grouped operation author on its supported isolated host
        run: "cargo test --locked -p clew --lib 'documentation::agent_jobs::operation_draft::context_mode::tests::' -- --test-threads=1"
      - name: Test grouped independent review and recovery on its supported isolated host
        run: "cargo test --locked -p clew --lib 'documentation::agent_jobs::operation_draft_review::context_mode::tests::' -- --test-threads=1"
      - run: cargo test --locked -p clew --test documentation_system docsys_t04_ -- --test-threads=1
      - run: 'cargo test --locked -p clew --test documentation_system _recovery:: -- --test-threads=1'

  verify:
    if: always()
    needs: [ci-plan, verify-linux, documentation-recovery-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Linux suite and macOS recovery check
        env:
          PLAN_RESULT: ${{ needs.ci-plan.result }}
          REUSE_FULL_CI: ${{ needs.ci-plan.outputs.reuse_full_ci }}
          LINUX_RESULT: ${{ needs.verify-linux.result }}
          MACOS_RESULT: ${{ needs.documentation-recovery-macos.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$REUSE_FULL_CI" = true ]; then exit 0; fi
          test "$LINUX_RESULT" = success
          test "$MACOS_RESULT" = success
