name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GitHub's synthetic pull-request merge commit contains the actor's
          # identity. Scan the submitted head and its real history instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - run: python3 scripts/check_repository_privacy.py --self-test
      - run: python3 scripts/check_repository_privacy.py --history
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: dtolnay/rust-toolchain@1.92.0
        with: { components: 'rustfmt,clippy' }
      - uses: Swatinem/rust-cache@v2
      - run: chmod +x gradlew fixtures/kotlin-basic/gradlew scripts/*.sh
      - run: ./scripts/ci-verify.sh
